<div class="container">
    <h2>User Management</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let user of users">
                <td>{{ user.id }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>
                    <a [routerLink]="['/profile', user.id]" class="btn">View</a>
                    <a [routerLink]="['/edit', user.id]" class="btn">Edit</a>
                    <button (click)="confirmDelete(user)" class="btn danger">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
    <div class="confirm-dialog" *ngIf="showConfirmDelete">
        <p>Are you sure you want to delete your account? {{ userToDelete?.username }}?</p>
        <button (click)="deleteUser()" class="btn danger">Delete</button>
        <button (click)="cancelDelete()" class="btn">Cancel</button>
    </div>
    <a routerLink="/home" class="back-link">Back</a>
</div>
